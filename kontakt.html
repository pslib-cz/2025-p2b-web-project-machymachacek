<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt – Burger Bistro Liberec</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-kontakt" data-page="kontakt">
  <script src="components.js"></script>

  <section id="kontakt">
    <div class="kontakt-inner">
      <div class="kontakt-info">
        <h1 class="kontakt-heading">Kde nás<br>najdete</h1>

        <div class="kontakt-item">
          <span class="kontakt-label">Adresa</span>
          <span class="kontakt-value">Burger Bistro Liberec<br>Náměstí Dr. E. Beneše 1<br>460 01 Liberec</span>
        </div>

        <div class="kontakt-item">
          <span class="kontakt-label">Telefon</span>
          <span class="kontakt-value"><a href="tel:+420777123456">+420 777 123 456</a></span>
        </div>

        <div class="kontakt-item">
          <span class="kontakt-label">E-mail</span>
          <span class="kontakt-value"><a href="mailto:info@burgerbistroliberec.cz">info@burgerbistroliberec.cz</a></span>
        </div>

        <div class="kontakt-item">
          <span class="kontakt-label">Sociální sítě</span>
          <span class="kontakt-value">
            <a href="#">Instagram: @BurgerBistroLiberec</a><br>
            <a href="#">Facebook: Burger Bistro Liberec</a>
          </span>
        </div>
      </div>

      <div class="mapa-wrap">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2549.9!2d15.0543!3d50.7671!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x470937a817c5a879%3A0xa4df71f3b0a92a3d!2sN%C3%A1m%C4%9Bst%C3%AD%20Dr.%20Edvarda%20Bene%C5%A1e%2C%20Liberec!5e0!3m2!1scs!2scz!4v1700000000000"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Mapa – Burger Bistro Liberec"
        ></iframe>
      </div>
    </div>
  </section>

</body>
</html>
