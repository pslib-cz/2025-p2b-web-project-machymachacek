<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ceník – Burger Bistro Liberec</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="cenik">
  <script src="components.js"></script>

  <section id="ceník">
    <div class="section-header">
      <h1 class="section-title">Ceník</h1>
    </div>

    <div class="cenik-grid">

      <div>
        <div class="cenik-group">
          <div class="cenik-group-title">Burgery</div>
          <div class="cenik-item"><span class="cenik-name">Klasický burger</span><span class="cenik-price">179 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Sýrový burger</span><span class="cenik-price">189 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Barbecue burger</span><span class="cenik-price">199 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Burger s modrým sýrem</span><span class="cenik-price">199 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Spicy burger</span><span class="cenik-price">189 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Extra pálivej burger</span><span class="cenik-price">209 Kč</span></div>
        </div>

        <div class="cenik-group">
          <div class="cenik-group-title">Nápoje</div>
          <div class="cenik-item"><span class="cenik-name">Kola</span><span class="cenik-price">55 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Pivo</span><span class="cenik-price">65 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Voda</span><span class="cenik-price">40 Kč</span></div>
        </div>
      </div>

      <div>
        <div class="cenik-group">
          <div class="cenik-group-title">Přílohy</div>
          <div class="cenik-item"><span class="cenik-name">Hranolky</span><span class="cenik-price">69 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Krokety</span><span class="cenik-price">69 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Salát</span><span class="cenik-price">59 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Batáty</span><span class="cenik-price">79 Kč</span></div>
        </div>

        <div class="cenik-group">
          <div class="cenik-group-title">Dezerty</div>
          <div class="cenik-item"><span class="cenik-name">Cheesecake</span><span class="cenik-price">89 Kč</span></div>
          <div class="cenik-item"><span class="cenik-name">Zmrzlina</span><span class="cenik-price">65 Kč</span></div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
